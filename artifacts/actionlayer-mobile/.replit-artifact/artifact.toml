kind = "mobile"
previewPath = "/actionlayer-mobile/"
title = "ActionLayer"
description = "A mobile action compiler for students that turns screenshots, documents, text, and links into source-grounded workflows with tasks, evidence, and readiness audits."
version = "1.0.0"
id = "artifacts/actionlayer-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/actionlayer-mobile/" ]
localPort = 18974

[services.development]
run = "pnpm --filter @workspace/actionlayer-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/actionlayer-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/actionlayer-mobile", "run", "serve" ]

[services.env]
PORT = "18974"
BASE_PATH = "/actionlayer-mobile/"
